<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 的虚拟小家 V7 - 严格控量版</title>
    <style>
        :root {
            --ui-bg: rgba(255, 255, 255, 0.7); --ui-border: rgba(255, 255, 255, 0.4);
            --text-color: #333; --msg-bg-ai: rgba(128, 128, 128, 0.3);
            --msg-bg-user: rgba(200, 200, 200, 0.4); --bubble-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        body, html { 
    margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Segoe UI', sans-serif; 
    overflow-x: auto; /* 👈 允许左右滑动 */
    overflow-y: hidden; /* 👈 依然禁止上下滑动 */
    background-color: #e0f7fa; 
}
        #game-container { 
    position: relative; 
    height: 100vh; 
    min-width: 178vh; /* 👈 核心修改：强制撑开宽度 */
    background-size: cover; background-position: center; background-repeat: no-repeat; transition: background-image 0.3s ease; 
}
        #night-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 10, 35, 0.4); pointer-events: none; transition: opacity 2s ease; opacity: 0; z-index: 100; }
        .glass-panel { background: var(--ui-bg); backdrop-filter: blur(10px); border: 1px solid var(--ui-border); border-radius: 12px; padding: 10px 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); color: var(--text-color); z-index: 110; }
        #time-display { position: fixed; top: 20px; left: 20px; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        #settings-btn { position: fixed; top: 20px; right: 20px; cursor: pointer; font-weight: bold; transition: transform 0.2s; }
        #settings-btn:hover { transform: scale(1.05); }
        #message-icon { position: fixed; bottom: 30px; right: 30px; font-size: 40px; cursor: pointer; transition: transform 0.2s; z-index: 110; }
        #message-icon:hover { transform: scale(1.1); }
        #character { position: absolute; width: 400px; height: 400px; bottom: 0%; left: 50%; transform: translateX(-50%); background-size: contain; background-repeat: no-repeat; background-position: bottom center; cursor: pointer; z-index: 10; display: flex; justify-content: center; align-items: flex-start; }
        #emotion-bubble { position: absolute; top: -50px; background: white; padding: 5px 12px; border-radius: 25px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); font-size: 24px; opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; z-index: 15; }
        #emotion-bubble::after { content: ''; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%); border-width: 8px 8px 0; border-style: solid; border-color: white transparent transparent transparent; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 200; }
        .glass-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); flex-direction: column; gap: 15px; z-index: 210; }
        .close-btn { align-self: flex-end; cursor: pointer; color: #aaa; font-size: 20px; transition: color 0.2s; }
        .close-btn:hover { color: #333; }
        #message-modal { width: 800px; height: 600px; padding: 20px; max-width: 90vw; max-height: 80vh; }
        #message-content { flex: 1; position: relative; background: var(--ui-bg); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
        #message-content::before { content: ''; position: absolute; top: 10px; bottom: 10px; left: 50%; border-left: 2px dashed #bbb; transform: translateX(-50%); pointer-events: none; }
        #chat-history { flex: 1; overflow-y: auto; padding: 10px 20px; display: flex; flex-direction: column; gap: 20px; }
        .msg-container { display: flex; flex-direction: column; max-width: 45%; }
        .msg-container.ai { align-self: flex-start; }
        .msg-container.user { align-self: flex-end; align-items: flex-end; }
        .msg-header { font-size: 11px; color: #666; margin-bottom: 3px; }
        .msg-bubble { padding: 10px 15px; border-radius: 12px; font-size: 14px; box-shadow: var(--bubble-shadow); line-height: 1.5; word-wrap: break-word;}
        .msg-container.ai .msg-bubble { background: var(--msg-bg-ai); border-top-left-radius: 0; }
        .msg-container.user .msg-bubble { background: var(--msg-bg-user); border-top-right-radius: 0; }
        #clear-chat-btn { position: absolute; top: 15px; left: 15px; font-size: 12px; padding: 5px 10px; background: #ff5252; color: white; border: none; border-radius: 5px; cursor: pointer;}
        #chat-input-area { display: flex; gap: 8px; padding: 15px 20px; border-top: 1px solid rgba(0,0,0,0.1); background: rgba(255,255,255,0.3); }
        #chat-input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #ccc; outline: none; }
        button { padding: 8px 18px; border: none; border-radius: 8px; background: #4CAF50; color: white; cursor: pointer;}
        #settings-modal { width: 400px; max-width: 90vw; padding: 25px; }
        .setting-group { display: flex; flex-direction: column; gap: 6px; }
        .setting-group input, .setting-group textarea { padding: 9px; border-radius: 5px; border: 1px solid #ccc; width: 100%; box-sizing: border-box; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="night-overlay"></div>
    <div id="time-display" class="glass-panel">
        <span id="time-icon">🌞</span> <span id="time-text">00:00</span>
    </div>
    <div id="settings-btn" class="glass-panel">⚙️ 偏好设置</div>
    <div id="message-icon">✉️</div>
    <div id="character"><div id="emotion-bubble"></div></div>
</div>

<div class="modal-overlay" id="modal-overlay"></div>

<div id="message-modal" class="glass-panel glass-modal">
    <button id="clear-chat-btn">清空记录</button>
    <div class="close-btn" id="close-message">✖</div>
    <h3 style="margin: 0; margin-bottom: 10px; text-align: center;">✉️ 留言板</h3>
    <div id="message-content">
        <div id="chat-history"></div>
        <div id="chat-input-area">
            <input type="text" id="chat-input" placeholder="写点什么...">
            <button id="send-btn">发送</button>
        </div>
    </div>
</div>

<div id="settings-modal" class="glass-panel glass-modal">
    <div class="close-btn" id="close-settings">✖</div>
    <h3 style="margin: 0;">API 与 人设配置</h3>
    <div class="setting-group">
        <label>接口地址 (Base URL):</label>
        <input type="text" id="api-url" placeholder="例如: https://api.openai.com/v1">
    </div>
    <div class="setting-group">
        <label>API 密钥 (API Key):</label>
        <input type="password" id="api-key" placeholder="sk-...">
    </div>
    <div class="setting-group">
        <label>AI 人设 (System Prompt):</label>
        <textarea id="api-persona" rows="4"></textarea>
    </div>
    <button id="save-settings-btn">保存配置</button>
</div>

<script>
    // --- 基础配置 ---
    const EMOJI_LIBRARY = ['❤️', '✨', '💤', '🎵', '❓', '🌸', '😋', '💬', '👀', '🥰', '🥹', '🥺', '😎', '😋', '😖', '😢', '😇', '😾', '💢', '❔', '😡', '😭', '🤤', '😥', '😞', '🥵', '🤒', '🤧', '😷', '💋', '🐱', '🐶', '🌧️', '☀️', '💦', '🍟', '🍝', '🍺', '🎧', '🎤', '🎹', '🎲', '🛍️', '🎉', '💌', '🩷', '💕', '💞', '💓', '💔', '❗️', '❓', '❌', '🔆', '🌀', '💤', '🎶', '🎵', '🔇', '🔕', '💬', '💭'];
    let config = {
        url: localStorage.getItem('ai_url') || '',
        key: localStorage.getItem('ai_key') || '',
        persona: localStorage.getItem('ai_persona') || '你是一个住在虚拟房间里的可爱伙伴，性格温柔。'
    };

    let characterState = 'idle'; 
    let actionTimer = null;
    const SPRITE_MAP = { 'idle': 'stand.png', 'blush': 'blush.png', 'wag': 'tail_wag.png', 'blush_wag': 'blush_wag.png', 'reading': 'reading.png', 'sleeping': 'sleeping.png' };
    const MOOD_WORDS = { 'idle': ['闲逛中', '发呆中', '心情平稳'], 'reading': ['专注看书', '沉浸其中'], 'sleeping': ['正在做梦', '深睡状态'], 'reactive': ['超开心', '有点害羞'] };

    // --- 离线回归与后台管理核心逻辑 ---
    function updateLastActiveTime() {
        localStorage.setItem('last_active_time', Date.now().toString());
    }

    // 检查是否刚刚从长时间离线中回归
    function checkOfflineReturn() {
        const lastActive = localStorage.getItem('last_active_time');
        if (!lastActive) return;

        // 首先检查并更新跨天逻辑，确保计数的准确性
        const todayStr = new Date().toDateString();
        const lastDate = localStorage.getItem('auto_post_date');
        let count = parseInt(localStorage.getItem('auto_post_count') || '0');

        if (lastDate !== todayStr) {
            count = 0;
            localStorage.setItem('auto_post_date', todayStr);
            localStorage.setItem('auto_post_count', '0');
        }

        // 核心修改：如果今天已经用完了6次额度，严禁触发回归留言
        if (count >= 6) {
            console.log("今日主动调用已达 6 次上限，跳过离线回归打招呼。");
            return;
        }

        const timeAwayMs = Date.now() - parseInt(lastActive);
        const hoursAway = (timeAwayMs / (1000 * 60 * 60)).toFixed(1);

        // 如果离开超过 2 小时（测试时可调小）
        if (timeAwayMs > 2 * 60 * 60 * 1000) { 
            console.log(`用户离开了 ${hoursAway} 小时，触发回归留言`);
            triggerAIAutonomousMessage(`【系统指令】用户离开了房间 ${hoursAway} 个小时，刚刚才推门回来。请你主动给用户留一张小纸条，表达你在这段时间的心情（比如无聊、想念、或者一直在看书睡觉），并欢迎用户回来。字数控制在30-300字左右。`);
        }
    }

    document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
            updateLastActiveTime();
        } else {
            checkOfflineReturn();
            updateTime();
            updateLastActiveTime();
        }
    });

    // --- 每日随机主动调用逻辑 ---
    function checkAutoPost() {
        const now = new Date();
        const todayStr = now.toDateString();
        const lastDate = localStorage.getItem('auto_post_date');
        let count = parseInt(localStorage.getItem('auto_post_count') || '0');

        if (lastDate !== todayStr) { count = 0; localStorage.setItem('auto_post_date', todayStr); localStorage.setItem('auto_post_count', '0'); }
        if (count >= 6) return;

        if (Math.random() < 0.005) { // 每分钟 0.5% 的概率
            triggerAIAutonomousMessage(`【系统指令】现在是你的自由留言时间。当前现实时间是 ${now.getHours()}点。请你主动给用户留一张小纸条，分享你的心情或对用户的一句问候。字数控制在30-300字以内。`);
        }
    }

    async function triggerAIAutonomousMessage(prompt) {
        if (!config.url || !config.key) return;

        // 统一所有主动调用（包括回归和随机）都要扣除 1 次每日额度
        let count = parseInt(localStorage.getItem('auto_post_count') || '0');
        localStorage.setItem('auto_post_count', (count + 1).toString());

        await sendMessageToAI(prompt, true); 
    }

    // --- 基础系统功能 ---
    const timeText = document.getElementById('time-text');
    const timeIcon = document.getElementById('time-icon');
    const nightOverlay = document.getElementById('night-overlay');
    const character = document.getElementById('character');
    const emotionBubble = document.getElementById('emotion-bubble');
    const gameContainer = document.getElementById('game-container');

    function updateTime() {
        const now = new Date(); const h = now.getHours();
        timeText.innerText = `${h.toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
        nightOverlay.style.opacity = (h >= 19 || h < 6) ? '1' : '0'; timeIcon.innerText = (h >= 19 || h < 6) ? '🌙' : '🌞';
        checkAutoPost();
        updateLastActiveTime(); 
    }
    setInterval(updateTime, 1000 * 60);
    updateTime();
    
    // 初始化时也检查一次离线
    checkOfflineReturn();

    function setCharacterSprite(state) {
        characterState = state; 
        if (state === 'reading' || state === 'sleeping') { gameContainer.style.backgroundImage = `url('${SPRITE_MAP[state]}')`; character.style.backgroundImage = 'none'; } 
        else { gameContainer.style.backgroundImage = `url('scene.png')`; character.style.backgroundImage = `url('${SPRITE_MAP[state] || SPRITE_MAP['idle']}')`; }
    }
    setCharacterSprite('idle');

    function showSpecificEmotion(emoji) { emotionBubble.innerText = emoji; emotionBubble.style.opacity = '1'; setTimeout(() => { emotionBubble.style.opacity = '0'; }, 2500); }

    function triggerRandomEvent() {
        if (characterState !== 'idle') return;
        const rand = Math.random(); const now = new Date().getHours();
        if (rand < 0.1 && (now >= 22 || now < 6)) { startBehavior('sleeping', 6 * 3600000); } 
        else if (rand > 0.85) { startBehavior('reading', Math.random() * 3600000 + 600000); }
    }
    setInterval(triggerRandomEvent, 15000);

    function startBehavior(state, duration) { interruptBehavior(); setCharacterSprite(state); actionTimer = setTimeout(() => { interruptBehavior(); }, duration); }
    function interruptBehavior() { characterState = 'idle'; setCharacterSprite('idle'); clearTimeout(actionTimer); }

    // --- 互动与留言板 ---
    const chatHistory = document.getElementById('chat-history');
    const chatInput = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');
    const clearChatBtn = document.getElementById('clear-chat-btn');

    function saveChat() { localStorage.setItem('ai_chat_v5', chatHistory.innerHTML); }
    function loadChat() { chatHistory.innerHTML = localStorage.getItem('ai_chat_v5') || ''; chatHistory.scrollTop = chatHistory.scrollHeight; }
    loadChat();

    clearChatBtn.onclick = () => { if(confirm('清空记录？')) { chatHistory.innerHTML = ''; localStorage.removeItem('ai_chat_v5'); } };

    function appendMsg(text, sender) {
        const container = document.createElement('div'); container.className = `msg-container ${sender}`;
        const mood = sender === 'user' ? '心情不错' : (MOOD_WORDS[characterState] ? MOOD_WORDS[characterState][0] : '悠闲');
        container.innerHTML = `<div class="msg-header">${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})} ${mood}</div><div class="msg-bubble">${text}</div>`;
        chatHistory.appendChild(container); chatHistory.scrollTop = chatHistory.scrollHeight; saveChat();
    }

    async function sendMessageToAI(userText, isAuto = false) {
        if (!config.url || !config.key) return;
        if (!isAuto) appendMsg(userText, 'user');
        
        const loading = document.createElement('div'); loading.className = 'msg-container ai'; loading.innerHTML = `<div class="msg-bubble">...</div>`;
        chatHistory.appendChild(loading); chatHistory.scrollTop = chatHistory.scrollHeight;

        const allMessages = [{ role: "system", content: config.persona }];
        const history = Array.from(chatHistory.querySelectorAll('.msg-container')).slice(-11, -1);
        history.forEach(m => {
            const role = m.classList.contains('user') ? 'user' : 'assistant'; const content = m.querySelector('.msg-bubble').innerText;
            if(content !== '...') allMessages.push({ role, content });
        });
        if (isAuto) allMessages.push({ role: "system", content: userText }); 

        try {
            let apiPath = config.url.trim(); if(!apiPath.endsWith('/chat/completions')) apiPath += (apiPath.endsWith('/') ? '' : '/') + 'chat/completions';
            const resp = await fetch(apiPath, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${config.key}` }, body: JSON.stringify({ model: "gemini-2.5-pro", messages: allMessages }) });
            const data = await resp.json(); chatHistory.removeChild(loading);
            const reply = data.choices[0].message.content;
            if (characterState !== 'idle') interruptBehavior();
            appendMsg(reply, 'ai'); showSpecificEmotion('💬');
        } catch (e) { chatHistory.removeChild(loading); appendMsg("【系统】连接失败了...", 'ai'); }
    }

    sendBtn.onclick = () => { const t = chatInput.value.trim(); if(t) { sendMessageToAI(t); chatInput.value = ''; } };
    chatInput.onkeypress = (e) => { if(e.key === 'Enter') sendBtn.onclick(); };

    // --- UI 交互 ---
    const modalOverlay = document.getElementById('modal-overlay');
    const msgModal = document.getElementById('message-modal');
    const setModal = document.getElementById('settings-modal');

    document.getElementById('message-icon').onclick = () => { modalOverlay.style.display = 'block'; msgModal.style.display = 'flex'; };
    document.getElementById('settings-btn').onclick = () => { modalOverlay.style.display = 'block'; setModal.style.display = 'flex'; };
    document.querySelectorAll('.close-btn').forEach(b => b.onclick = () => { modalOverlay.style.display = 'none'; msgModal.style.display = 'none'; setModal.style.display = 'none'; });
    modalOverlay.onclick = () => { document.querySelectorAll('.close-btn')[0].onclick(); };

    character.onclick = (e) => {
        e.stopPropagation();
        if(characterState === 'reading' || characterState === 'sleeping') { interruptBehavior(); showSpecificEmotion('❓'); }
        else { setCharacterSprite('blush_wag'); showSpecificEmotion('❤️'); setTimeout(()=>setCharacterSprite('idle'), 2500); }
    };

    document.getElementById('api-url').value = config.url; document.getElementById('api-key').value = config.key; document.getElementById('api-persona').value = config.persona;
    document.getElementById('save-settings-btn').onclick = () => {
        config.url = document.getElementById('api-url').value; config.key = document.getElementById('api-key').value; config.persona = document.getElementById('api-persona').value;
        localStorage.setItem('ai_url', config.url); localStorage.setItem('ai_key', config.key); localStorage.setItem('ai_persona', config.persona);
        alert('设置已保存！'); document.querySelectorAll('.close-btn')[0].onclick();
    };
</script>
</body>
</html>
